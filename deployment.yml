apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: djangoserver
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
      - image: us.icr.io/sn-labs-moldiromar42/djangoserver:1
        imagePullPolicy: Always
        name: djangoserver
        env:
        - name: SONGS_API_URL
          value: "https://moldiromar42-8080.theiaopenshiftnext-0-labs-prod-theiaopenshift-4-tor01.proxy.cognitiveclass.ai"
        - name: PICTURES_API_URL
          value: "https://pictures.2h96q6yukjcb.us-south.codeengine.appdomain.cloud"
        ports:
        - containerPort: 8000
          protocol: TCP
      restartPolicy: Always
